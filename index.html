<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="theme-color" content="#8FC96B" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <div id="root">

      <div
        style="

          max-width: 320px;
          margin: 25vh auto 0;
          padding: 0 20px;
          text-align: center;
          color: #141914;
        "
      >
        <p style="font-size: 17px; line-height: 26px; font-weight: 700; margin: 0">
          First Bite could not load.
        </p>
        <p style="font-size: 15px; line-height: 22px; color: #5C6459; margin: 8px 0 0">

        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
